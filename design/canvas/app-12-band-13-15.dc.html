<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ages 13–15 budget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FEF5E0;font-family:'Nunito',sans-serif;color:#3E2312;display:flex;flex-direction:column;padding:48px 20px 28px;gap:12px">
  <div style="display:flex;align-items:center;gap:10px">
    <a aria-label="Back" style="width:48px;height:48px;border-radius:999px;border:2px solid #3E2312;background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px">&lt;</a>
    <div style="flex:1">
      <div style="font-weight:800;font-size:13px;color:#644D3B;text-transform:uppercase;letter-spacing:.04em">Side Hustle · First sale</div>
      <h1 style="margin:0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;line-height:1.1">Set your price</h1>
    </div>
  </div>
  <div style="background:#fff;border:2px solid #3E2312;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:14px">
    <div>
      <div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px"><span>Cost per item</span><span>GH₵ 8</span></div>
      <div style="position:relative;height:28px;margin-top:6px"><div style="position:absolute;left:0;right:0;top:11px;height:6px;border-radius:999px;background:#F2E8D4"></div><div style="position:absolute;left:0;top:11px;width:40%;height:6px;border-radius:999px;background:#F68C1F"></div><div style="position:absolute;left:calc(40% - 14px);top:0;width:28px;height:28px;border-radius:999px;background:#FBCE16;border:3px solid #3E2312"></div></div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px"><span>Selling price</span><span>GH₵ 15</span></div>
      <div style="position:relative;height:28px;margin-top:6px"><div style="position:absolute;left:0;right:0;top:11px;height:6px;border-radius:999px;background:#F2E8D4"></div><div style="position:absolute;left:0;top:11px;width:62%;height:6px;border-radius:999px;background:#F68C1F"></div><div style="position:absolute;left:calc(62% - 14px);top:0;width:28px;height:28px;border-radius:999px;background:#FBCE16;border:3px solid #3E2312"></div></div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px"><span>Items to make</span><span>20</span></div>
      <div style="position:relative;height:28px;margin-top:6px"><div style="position:absolute;left:0;right:0;top:11px;height:6px;border-radius:999px;background:#F2E8D4"></div><div style="position:absolute;left:0;top:11px;width:50%;height:6px;border-radius:999px;background:#F68C1F"></div><div style="position:absolute;left:calc(50% - 14px);top:0;width:28px;height:28px;border-radius:999px;background:#FBCE16;border:3px solid #3E2312"></div></div>
    </div>
  </div>
  <div style="background:#FBE57E;border:3px solid #3E2312;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:16px"><span>Budget used</span><span>GH₵ 160 of 200</span></div>
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:16px"><span>If all sell</span><span>GH₵ 300</span></div>
    <div style="height:2px;background:#3E2312"></div>
    <div style="display:flex;justify-content:space-between;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px"><span>Profit</span><span>GH₵ 140</span></div>
    <div style="font-weight:700;font-size:14px;color:#3E2312">Profit is what you earn minus what it cost you. Raising the price may mean fewer buyers.</div>
  </div>
  <div style="flex:1;display:flex;align-items:flex-end;gap:10px;background:#fff;border:2px solid #3E2312;border-radius:18px;padding:12px 16px">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:100%;height:70px;background:#F68C1F;border-radius:8px 8px 0 0"></div><span style="font-weight:800;font-size:13px">Cost</span></div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:100%;height:112px;background:#FBCE16;border:2px solid #3E2312;border-radius:8px 8px 0 0"></div><span style="font-weight:800;font-size:13px">Income</span></div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:100%;height:52px;background:#16793A;border-radius:8px 8px 0 0"></div><span style="font-weight:800;font-size:13px">Profit</span></div>
  </div>
  <button style="width:100%;height:68px;border-radius:999px;border:2px solid #3E2312;background:#FBCE16;color:#3E2312;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;box-shadow:0 5px 0 #3E2312">Run the sale</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</body>
</html>
