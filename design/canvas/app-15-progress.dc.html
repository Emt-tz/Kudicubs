<x-dc>
<helmet>

<div style="width:390px;height:844px;box-sizing:border-box;background:#FEF5E0;font-family:'Nunito',sans-serif;color:#3E2312;display:flex;flex-direction:column">
  <div style="flex:1;padding:44px 20px 0;display:flex;flex-direction:column;gap:14px;overflow:hidden">

    <div style="background:#fff;border:2px solid #3E2312;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px"><span>Know</span><span>30%</span></div><div style="height:14px;border-radius:999px;background:#F2E8D4;overflow:hidden"><div style="width:30%;height:100%;background:#F68C1F"></div></div></div>
      <div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px"><span>Understand</span><span>20%</span></div><div style="height:14px;border-radius:999px;background:#F2E8D4;overflow:hidden"><div style="width:20%;height:100%;background:#F68C1F"></div></div></div>
      <div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px"><span>Decide</span><span>10%</span></div><div style="height:14px;border-radius:999px;background:#F2E8D4;overflow:hidden"><div style="width:10%;height:100%;background:#F68C1F"></div></div></div>
      <div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px"><span>Invest</span><span>0%</span></div><div style="height:14px;border-radius:999px;background:#F2E8D4;overflow:hidden"><div style="width:0%;height:100%;background:#F68C1F"></div></div></div>
      <div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px"><span>Share</span><span>10%</span></div><div style="height:14px;border-radius:999px;background:#F2E8D4;overflow:hidden"><div style="width:10%;height:100%;background:#F68C1F"></div></div></div>
    </div>
    <h2 style="margin:4px 0 0;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:22px">My badges</h2>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      <button style="border-radius:20px;border:3px solid #3E2312;background:#FBE57E;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#3E2312;font-weight:800;font-size:14px"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#FBAA19" stroke="#3E2312" stroke-width="3"/></svg>First Coins</button>
      <button style="border-radius:20px;border:3px solid #3E2312;background:#FBE57E;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#3E2312;font-weight:800;font-size:14px"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#F68C1F" stroke="#3E2312" stroke-width="3"/></svg>Kind Friend</button>
      <button style="border-radius:20px;border:3px solid #3E2312;background:#FBE57E;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#3E2312;font-weight:800;font-size:14px"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#FBCE16" stroke="#3E2312" stroke-width="3"/></svg>Early Bird</button>
      <button aria-label="Hard Worker, not earned yet" style="border-radius:20px;border:3px dashed #8B7764;background:#F2E8D4;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#644D3B;font-weight:800;font-size:14px"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#8B7764" stroke-width="3" stroke-dasharray="5 4"/></svg>Hard Worker</button>
      <button aria-label="Smart Sorter, not earned yet" style="border-radius:20px;border:3px dashed #8B7764;background:#F2E8D4;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#644D3B;font-weight:800;font-size:14px"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#8B7764" stroke-width="3" stroke-dasharray="5 4"/></svg>Smart Sorter</button>

    </div>
  </div>
  <nav style="height:84px;background:#fff;border-top:2px solid #3E2312;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 12px 12px;gap:8px">
    <a style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:14px;color:#644D3B"><span style="width:26px;height:26px;border-radius:8px;border:2px solid #644D3B;display:block"></span>Home</a>
    <a style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:14px;color:#644D3B"><span style="width:26px;height:26px;border-radius:999px;border:2px solid #644D3B;display:block"></span>Wallet</a>
    <a style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:16px;background:#FBE57E;font-weight:800;font-size:14px"><span style="width:26px;height:26px;border-radius:8px;border:2px solid #3E2312;display:block;transform:rotate(45deg) scale(.8)"></span>Progress</a>
  </nav>
</div>
