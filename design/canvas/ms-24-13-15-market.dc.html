<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ages 13–15 market</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FEF5E0;font-family:'Nunito',sans-serif;color:#3E2312;display:flex;flex-direction:column;padding:48px 20px 28px;gap:12px">
  <div style="display:flex;align-items:center;gap:10px">
    <a aria-label="Back" style="width:48px;height:48px;border-radius:999px;border:2px solid #3E2312;background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px">&lt;</a>
    <div style="flex:1">
      <div style="font-weight:800;font-size:13px;color:#644D3B;text-transform:uppercase;letter-spacing:.04em">Side Hustle · First sale</div>
      <h1 style="margin:0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;line-height:1.1">Read the market</h1>
    </div>
  </div>
  <div style="background:#fff;border:2px solid #3E2312;border-radius:18px;padding:12px 14px">
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;margin-bottom:4px">How many people would buy</div>
    <svg width="320" height="190" viewBox="0 0 320 190" role="img" aria-label="Demand curve: at GH₵ 8 about 20 buyers, at GH₵ 15 about 13 buyers, at GH₵ 22 about 8 buyers, at GH₵ 28 about 3 buyers. Your chosen price GH₵ 15 is marked.">
      <line x1="40" y1="10" x2="40" y2="150" stroke="#3E2312" stroke-width="2"/>
      <line x1="40" y1="150" x2="310" y2="150" stroke="#3E2312" stroke-width="2"/>
      <g stroke="#F2E8D4" stroke-width="1"><line x1="40" y1="45" x2="310" y2="45"/><line x1="40" y1="80" x2="310" y2="80"/><line x1="40" y1="115" x2="310" y2="115"/></g>
      <polyline points="60,24 130,66 200,104 270,138" fill="none" stroke="#F68C1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="130" y1="66" x2="130" y2="150" stroke="#3E2312" stroke-width="2" stroke-dasharray="5 4"/>
      <circle cx="130" cy="66" r="9" fill="#FBCE16" stroke="#3E2312" stroke-width="3"/>
      <g font-family="Nunito, sans-serif" font-size="12" font-weight="700" fill="#644D3B">
        <text x="6" y="28">20</text><text x="6" y="70">13</text><text x="12" y="112">8</text><text x="12" y="154">0</text>
        <text x="52" y="170">GH₵ 8</text><text x="112" y="170">GH₵ 15</text><text x="182" y="170">GH₵ 22</text><text x="252" y="170">GH₵ 28</text>
      </g>
      <text x="138" y="60" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#3E2312">Your price</text>
    </svg>
  </div>
  <div style="background:#fff;border:2px solid #3E2312;border-radius:18px;padding:14px 16px">
    <div style="display:flex;justify-content:space-between;font-weight:800;font-size:17px"><span>Selling price</span><span>GH₵ 15</span></div>
    <div style="position:relative;height:28px;margin-top:6px"><div style="position:absolute;left:0;right:0;top:11px;height:6px;border-radius:999px;background:#F2E8D4"></div><div style="position:absolute;left:0;top:11px;width:35%;height:6px;border-radius:999px;background:#F68C1F"></div><div style="position:absolute;left:calc(35% - 14px);top:0;width:28px;height:28px;border-radius:999px;background:#FBCE16;border:3px solid #3E2312"></div></div>
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:13px;color:#644D3B;margin-top:2px"><span>GH₵ 8</span><span>GH₵ 28</span></div>
  </div>
  <div style="background:#FBE57E;border:3px solid #3E2312;border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:16px"><span>Expected buyers</span><span style="font-weight:800">13 of 20</span></div>
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:16px"><span>Expected income</span><span style="font-weight:800">GH₵ 195</span></div>
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:16px"><span>Cost of 20 items</span><span style="font-weight:800">GH₵ 160</span></div>
  </div>
  <div style="flex:1"></div>
  <button style="width:100%;height:68px;border-radius:999px;border:2px solid #3E2312;background:#FBCE16;color:#3E2312;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;box-shadow:0 5px 0 #3E2312">Run the sale</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
