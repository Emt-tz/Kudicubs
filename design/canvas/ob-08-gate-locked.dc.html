<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parent gate locked</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#3E2312;font-family:'Nunito',sans-serif;color:#FEF5E0;display:flex;flex-direction:column;padding:48px 24px 32px;gap:18px">
  <div style="color:#FBE57E;font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase">For grown-ups</div>
  <h1 style="margin:0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:34px;line-height:1.1">Let's take a short break</h1>
  <p style="margin:0;font-size:18px;line-height:1.4">The grown-up gate is paused for a moment after a few tries. Nothing has been lost.</p>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
    <div style="position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center">
      <svg width="200" height="200" viewBox="0 0 200 200" style="position:absolute;left:0;top:0" role="img" aria-label="30 second wait">
        <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="14"/>
        <circle cx="100" cy="100" r="88" fill="none" stroke="#FBE57E" stroke-width="14" stroke-linecap="round" stroke-dasharray="404 553" transform="rotate(-90 100 100)"/>
      </svg>
      <div style="text-align:center">
        <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:56px;line-height:1">0:22</div>
        <div style="font-size:15px;color:#FBE57E;font-weight:700">until you can try again</div>
      </div>
    </div>
    <div style="display:flex;align-items:flex-start;gap:12px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px 16px;max-width:320px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FBE57E" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="10"/><path d="M12 11v5M12 7.5v.5"/></svg>
      <span style="font-size:16px;line-height:1.4">Your child's coins, badges and progress are safe. Only the grown-up area waits.</span>
    </div>
  </div>
  <button style="width:100%;height:60px;border-radius:999px;border:0;background:#FBCE16;color:#3E2312;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px">Back to the game</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
