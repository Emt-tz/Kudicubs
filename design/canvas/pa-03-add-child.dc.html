<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

<div style="width:390px;height:844px;box-sizing:border-box;background:#3E2312;font-family:'Nunito',sans-serif;color:#FEF5E0;display:flex;flex-direction:column;padding:44px 20px 28px;gap:14px">
  <a style="color:#FBE57E;font-weight:800;font-size:16px;min-height:48px;display:inline-flex;align-items:center">‹ Your children</a>
  <h1 style="margin:0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:32px;line-height:1.1">Add a child</h1>
  <div>
    <div style="font-weight:800;font-size:16px;margin-bottom:8px">Pick a nickname</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button style="min-height:48px;padding:0 20px;border-radius:999px;border:2px solid #FBE57E;background:#FBE57E;color:#3E2312;font-weight:800;font-size:17px">Ama</button>
      <button style="min-height:48px;padding:0 20px;border-radius:999px;border:2px solid #FBE57E;background:transparent;color:#FEF5E0;font-weight:800;font-size:17px">Kofi</button>
      <button style="min-height:48px;padding:0 20px;border-radius:999px;border:2px solid #FBE57E;background:transparent;color:#FEF5E0;font-weight:800;font-size:17px">Zara</button>
      <button style="min-height:48px;padding:0 20px;border-radius:999px;border:2px solid #FBE57E;background:transparent;color:#FEF5E0;font-weight:800;font-size:17px">Tobi</button>
    </div>
    <div style="font-size:14px;color:#FBE57E;margin-top:6px">Nicknames come from a short list. No real names.</div>
  </div>
  <div>
    <div style="font-weight:800;font-size:16px;margin-bottom:8px">Age band</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
      <button style="min-height:52px;border-radius:14px;border:2px solid #FBE57E;background:#FBE57E;color:#3E2312;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px">4–6</button>
      <button style="min-height:52px;border-radius:14px;border:2px solid #FBE57E;background:transparent;color:#FEF5E0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px">7–9</button>
      <button style="min-height:52px;border-radius:14px;border:2px solid #FBE57E;background:transparent;color:#FEF5E0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px">10–12</button>
      <button style="min-height:52px;border-radius:14px;border:2px solid #FBE57E;background:transparent;color:#FEF5E0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px">13–15</button>
    </div>
  </div>
  <div>
    <div style="font-weight:800;font-size:16px;margin-bottom:8px">Where does your family live?</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button style="min-height:52px;border-radius:14px;border:2px solid #FBE57E;background:#FBE57E;color:#3E2312;font-weight:800;font-size:17px;text-align:left;padding:0 16px;display:flex;justify-content:space-between;align-items:center">Ghana <span>GH₵ cedi</span></button>
      <button style="min-height:52px;border-radius:14px;border:2px solid #FBE57E;background:transparent;color:#FEF5E0;font-weight:800;font-size:17px;text-align:left;padding:0 16px;display:flex;justify-content:space-between;align-items:center">Nigeria <span>₦ naira</span></button>
      <button style="min-height:52px;border-radius:14px;border:2px solid #FBE57E;background:transparent;color:#FEF5E0;font-weight:800;font-size:17px;text-align:left;padding:0 16px;display:flex;justify-content:space-between;align-items:center">United Kingdom <span>£ pound</span></button>
    </div>
  </div>
  <div style="flex:1"></div>
  <button style="min-height:60px;border-radius:999px;border:2px solid #3E2312;background:#FBCE16;color:#3E2312;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px">Add child</button>
</div>
